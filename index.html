<!DOCTYPE html>
<html lang="en" data-theme="default">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🐒📖</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="topbar">
        <h1 title="Monkey of Babel">🐒📖</h1>
        <div class="fame-count" id="fameCount" title="Fame (shelves published)"></div>
    </header>

    <div class="offline-banner" id="offlineBanner" hidden>
        <div id="offlineBannerText"></div>
        <button class="key" id="dismissOfflineBtn" title="Dismiss">✓</button>
    </div>

    <main class="layout">
        <section class="panel" id="typewritersPanel">
            <h2 title="Monkeys &amp; Typewriters">🐒⌨️</h2>

            <div class="monkey-pool" id="monkeyPool"></div>
            <div class="key-row">
                <button class="key" id="buyHabitatBtn" title="Room for one more monkey">
                    <span class="key-icon">🏠</span>
                    <span class="key-ring" id="buyHabitatRing"></span>
                </button>
            </div>

            <div class="typewriter-grid" id="typewriterGrid"></div>
            <div class="key-row">
                <button class="key" id="assignOneBtn" title="Seat one monkey">➕</button>
                <button class="key" id="recallOneBtn" title="Recall one monkey">➖</button>
                <button class="key" id="fillTypewritersBtn" title="Seat everyone">⬆️</button>
                <button class="key" id="clearTypewritersBtn" title="Recall everyone">⬇️</button>
                <button class="key" id="buyTypewriterBtn" title="Add one typewriter">
                    <span class="key-icon">⌨️</span>
                    <span class="key-ring" id="buyTypewriterRing"></span>
                </button>
            </div>
        </section>

        <section class="panel" id="pagePanel">
            <h2 title="The Page">📄</h2>
            <div class="page-frame">
                <div class="page-view" id="pageView"></div>
            </div>
            <div class="page-stack" id="pageStack" title="Pages toward this book"></div>
        </section>

        <section class="panel" id="trainingPanel">
            <h2 title="Training">🎓</h2>
            <div class="tile-grid">
                <div class="tile">
                    <div class="tile-icon" title="Typing Speed">⌨️⚡</div>
                    <div class="level-row" id="typingSpeedLevel"></div>
                    <button class="key" id="trainTypingSpeedBtn">
                        <span class="key-icon">🧠</span>
                        <span class="key-ring" id="trainTypingSpeedRing"></span>
                    </button>
                </div>
                <div class="tile">
                    <div class="tile-icon" title="Word Chance">🍌🎲</div>
                    <div class="level-row" id="wordChanceLevel"></div>
                    <button class="key" id="trainWordChanceBtn">
                        <span class="key-icon">🧠</span>
                        <span class="key-ring" id="trainWordChanceRing"></span>
                    </button>
                </div>
                <div class="tile">
                    <div class="tile-icon" title="Sentence Chance">📝🎲</div>
                    <div class="level-row" id="sentenceChanceLevel"></div>
                    <button class="key" id="trainSentenceChanceBtn">
                        <span class="key-icon">🧠</span>
                        <span class="key-ring" id="trainSentenceChanceRing"></span>
                    </button>
                </div>
            </div>
            <div class="ink-pile" id="inkPile" title="Intelligence"></div>
        </section>

        <section class="panel" id="coinPanel">
            <h2 title="Money">💰</h2>
            <div class="coin-pile" id="coinPile"></div>
        </section>

        <section class="panel panel-prestige" id="shelfPanel">
            <h2 title="This Run's Shelf">📚</h2>
            <div class="shelf-grid" id="shelfGrid"></div>
            <div class="key-row">
                <button class="key key--wide key-prestige" id="publishBtn" title="Publish this shelf">📤</button>
            </div>
        </section>

        <section class="panel" id="libraryPanel" hidden>
            <h2 title="Library">📖</h2>
            <div class="library-list" id="libraryList"></div>
            <div class="store-subhead" title="Published shelves">📚🖼️</div>
            <div class="library-list" id="libraryWallList"></div>
        </section>

        <section class="panel" id="prodigyPanel" hidden>
            <h2 title="Prodigy Roster">🐒🌟</h2>
            <div class="tile-progress" id="prodigyBonusDial" title="Permanent money bonus from owned monkeys"></div>
            <div class="library-list" id="prodigyList"></div>
            <div class="token-row" id="prodigyTokenRow" title="Tokens toward next pull"></div>
            <div class="key-row">
                <button class="key key--wide key-prestige" id="prodigyPullBtn" title="Pull">🎰</button>
            </div>
            <p class="hint" id="prodigyPullHint"></p>
        </section>

        <section class="panel" id="storePanel" hidden>
            <h2 title="Store">🛒</h2>
            <p class="hint" id="storeStatusVal"></p>

            <div class="store-subhead" title="Watch an Ad">📺</div>
            <div class="tile-grid">
                <div class="tile">
                    <div class="tile-icon" title="2× Earnings">⚡</div>
                    <div class="tile-progress">
                        <span id="earningsBoostIcon">✅</span><span class="dial dial--sm" id="earningsBoostDial" hidden></span>
                    </div>
                    <button class="key" id="watchEarningsBoostAdBtn" title="Watch Ad">▶️</button>
                </div>
                <div class="tile">
                    <div class="tile-icon" title="Instant Page">⚡📄</div>
                    <div class="tile-progress">
                        <span id="instantPageIcon">✅</span><span class="dial dial--sm" id="instantPageDial" hidden></span>
                    </div>
                    <button class="key" id="watchInstantPageAdBtn" title="Watch Ad">▶️</button>
                </div>
            </div>

            <div class="store-subhead" title="Time Skips">⏭️</div>
            <div class="key-row" id="timeSkipRow"></div>

            <div class="store-subhead" title="Cosmetics">🎨</div>
            <p class="hint" title="Click a theme to buy (mock) or equip it.">ℹ️</p>
            <div class="library-list" id="cosmeticsList"></div>
        </section>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
</html>
